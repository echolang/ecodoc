name: release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    uses: echolang/setup-echo/.github/workflows/release.yml@v1
    with:
      changelog: false
      target-branch: ${{ github.event.workflow_run.head_branch }}
      # the version `ecodoc --version` prints
      extra-files: main.eco

  binaries:
    name: binaries (${{ matrix.asset }})
    needs: release
    if: needs.release.outputs.release-created == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: ecodoc-macos-arm64
          - os: ubuntu-24.04
            asset: ecodoc-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: ecodoc-linux-arm64

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag-name }}

      - uses: echolang/setup-echo@v1

      - run: epm install

      - name: Build
        run: |
          mkdir -p stage
          echoc build --release --target ecodoc -o stage/ecodoc
          stage/ecodoc --version

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag-name }}
          ASSET: ${{ matrix.asset }}
        run: |
          tar -czf "${ASSET}.tar.gz" -C stage ecodoc
          gh release upload "${TAG}" "${ASSET}.tar.gz" --clobber

  # `uses: echolang/ecodoc@v0` follows this tag. It moves only after every binary is attached,
  # so the action never resolves to a release it cannot download from
  major-tag:
    needs: [release, binaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag-name }}

      - name: Move the major tag
        env:
          TAG: ${{ needs.release.outputs.tag-name }}
        run: |
          major="${TAG%%.*}"
          git tag -f "${major}" "${TAG}"
          git push -f origin "refs/tags/${major}"
